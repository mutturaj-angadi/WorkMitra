[project]
name = "workplace-compliance-desk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "redis>=5,<7",
  "pypdf>=5,<7",
  "python-multipart>=0.0.12",
  "prometheus-client>=0.21,<1",
  "protobuf>=5.29.5,<6",
  "slowapi>=0.1.9,<1",
  "httpx>=0.27,<1",
  "locust>=2.32,<3",
  "langchain>=0.3,<2",
  "langgraph>=0.2,<2",
  "langchain-google-genai>=2.1.12,<3",
  "langchain-chroma>=0.2,<2",
  "chromadb>=0.6,<2",
  "sentence-transformers>=3,<6",
  "langsmith>=0.2,<1",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp>=1.28,<2",
]

[dependency-groups]
dev = ["pytest>=8.3.3,<10", "ruff>=0.11,<1"]

[tool.uv]
required-version = "==0.13.8"
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 88

# FastAPI uses Depends(...) in endpoint signatures as its standard dependency-injection API.
[tool.ruff.lint]
ignore = ["B008"]
