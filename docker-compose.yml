services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://desk@postgres:5432/desk}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CHROMA_URL: ${CHROMA_URL:-http://chromadb:8000}
      APP_ENV: production
      CORPUS_DIR: /app/corpus
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"], interval: 15s, timeout: 5s, retries: 5}
    restart: unless-stopped
  worker:
    build: .
    command: ["celery", "-A", "backend.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://desk@postgres:5432/desk}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORPUS_DIR: /app/corpus
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desk
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: desk
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U desk -d desk"], interval: 5s, timeout: 3s, retries: 10}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    restart: unless-stopped
  chromadb:
    image: chromadb/chroma:0.6.3
    volumes: ["chroma_data:/chroma/chroma"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus_data:/prometheus"]
    ports: ["9090:9090"]
    depends_on: [api]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3001:3000"]
    volumes: ["grafana_data:/var/lib/grafana", "./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on: [prometheus]
    restart: unless-stopped
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    ports: ["16686:16686", "4317:4317", "4318:4318"]
    restart: unless-stopped
volumes:
  postgres_data: {}
  redis_data: {}
  chroma_data: {}
  prometheus_data: {}
  grafana_data: {}
